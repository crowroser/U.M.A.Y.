name: Python Package - U.M.A.Y.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        # pip >= 24.1 rejects omegaconf==2.0.6's invalid PEP 440 metadata (PyYAML >=5.1.*)
        # rvc-python==0.1.5 strictly requires omegaconf==2.0.6
        # Solution: use pip < 24.1 which tolerates the metadata error
        python -m pip install "pip<24.1"
        pip install flake8 pytest
        pip install -r requirements.txt -v 2>&1 | tail -100
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-line-length=120 --statistics
    
    - name: Run basic import check
      run: |
        python -c "import src.ui.app; import src.pipeline; import src.tts; import src.rvc; print('✓ All imports successful')"
    
    - name: Run tests if available
      run: |
        pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found or pytest skipped"
      continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install bandit
      run: |
        pip install bandit
    
    - name: Run security check with bandit
      run: |
        bandit -r src/ -ll || true
      continue-on-error: true
